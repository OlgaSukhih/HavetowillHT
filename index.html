<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My life. My future. — A2 Homework</title><style>*{box-sizing:border-box}body{margin:0;background:#edf1f4;color:#24354b;font-family:Arial,sans-serif;font-size:21px;line-height:1.5}header{max-width:1080px;margin:auto;padding:22px 28px;display:flex;justify-content:space-between;font-size:14px;letter-spacing:2px;font-weight:bold}.bar{height:5px;background:#dce3e8}.bar div{height:100%;background:#427f80;transition:width .2s}main{max-width:1020px;margin:26px auto 110px;padding:36px 48px;background:#fff;border-radius:25px;box-shadow:0 12px 50px #24354b0b}h1{font-size:39px;line-height:1.15;margin:12px 0 24px}.tag{color:#427f80;font-size:14px;letter-spacing:2px;font-weight:bold}.formula{padding:20px 24px;border-radius:16px;background:#e8f2ef;font-size:23px;font-weight:bold;line-height:1.8}.example{border-left:4px solid #e6b96d;padding:8px 18px;margin:16px 0;font-size:24px}small{display:block;font-size:18px;color:#637184}.note{background:#fff4df;border-radius:14px;padding:18px;font-size:18px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:24px 0}.cards>div{background:#eff3f9;border-radius:18px;padding:22px}.cards p{margin:8px 0}.hero{font-size:clamp(30px,6vw,65px);font-weight:900;color:#427f80;padding:25px 0}.question{padding:16px 0;border-bottom:1px solid #e4e9ee}label{display:block;margin-bottom:10px}select,input,textarea{font:inherit;border:2px solid #cbd5df;border-radius:10px;padding:10px;background:#fff;color:#24354b;max-width:100%}input{width:330px}textarea{width:100%;min-height:80px;resize:vertical}.writing{margin:20px 0}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 24px;background:#427f80;color:white}button:disabled{opacity:.35;cursor:default}.check{margin-top:23px}.feedback{font-size:16px;display:block;margin-top:6px}.correct{border-color:#39806c}.incorrect{border-color:#bf765a}nav{position:fixed;bottom:0;left:0;right:0;background:#edf1f4f5;display:flex;justify-content:center;align-items:center;gap:22px;padding:16px;border-top:1px solid #dce3e8}nav span{font-size:17px}button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #e6b96d;outline-offset:3px}@media(max-width:650px){body{font-size:18px}main{margin:12px 12px 100px;padding:25px 20px}h1{font-size:30px}.formula{font-size:18px}.example{font-size:20px}.cards{grid-template-columns:1fr}nav{gap:12px}button{padding:11px 17px}}</style></head><body><header><span>ENGLISH / A2</span><span>HOMEWORK</span></header><div class="bar"><div></div></div><main></main><nav><button id="back">← Назад</button><span id="page"></span><button id="next">Далее →</button></nav><script>const slides=[{"tag": "START", "title": "My life. My future.", "body": "<div class=\"hero\">TODAY → TOMORROW</div><p>Домашнее задание • A2 • 20–25 минут</p><div class=\"cards\"><div><b>Have to</b><p>Что нужно делать?</p></div><div><b>Will</b><p>Что будет потом?</p></div></div><p>Прочитай правила, выполни задания и скачай ответы в конце.</p>"}, {"tag": "01 / ПРАВИЛО", "title": "Have to = нужно, приходится", "body": "<p>Используем <b>have to</b>, когда нужно что-то сделать: есть правило, обязанность или необходимость.</p><div class=\"formula\">I / you / we / they + have to + глагол<br>he / she / it + has to + глагол</div><div class=\"example\">I have to do my homework.<small>Мне нужно сделать домашнее задание.</small></div><div class=\"example\">Mia has to get up at seven.<small>Мие нужно вставать в семь.</small></div><p class=\"note\">После have to / has to — обычная форма глагола: <b>go, help, study</b>.</p>"}, {"tag": "02 / ПРАВИЛО", "title": "Don’t have to = не обязательно", "body": "<p>Если делать что-то <b>не нужно</b>, но при желании можно:</p><div class=\"formula\">I / you / we / they + don’t have to + глагол<br>he / she / it + doesn’t have to + глагол</div><div class=\"example\">I don’t have to get up early on Sunday.<small>Мне не нужно рано вставать в воскресенье.</small></div><div class=\"example\">Leo doesn’t have to wear a uniform.<small>Лео не обязательно носить форму.</small></div><p class=\"note\"><b>Это не запрет!</b> You don’t have to come. = Ты можешь не приходить.<br>You mustn’t come. = Тебе нельзя приходить.</p>"}, {"tag": "03 / ПРАВИЛО", "title": "Как спросить «Нужно ли…?»", "body": "<div class=\"formula\">Do + I / you / we / they + have to + глагол?<br>Does + he / she / it + have to + глагол?</div><div class=\"example\">Do you have to tidy your room?<small>Тебе нужно убираться в своей комнате?</small></div><div class=\"example\">Does Ben have to walk the dog?<small>Бену нужно выгуливать собаку?</small></div><div class=\"cards\"><div><b>Yes, I do.</b><p>No, I don’t.</p></div><div><b>Yes, he does.</b><p>No, he doesn’t.</p></div></div><p class=\"note\">После does / doesn’t используем <b>have to</b>, а не has to.</p>"}, {"tag": "04 / PRACTICE", "title": "Нужно или не обязательно?", "body": "<p>Прочитай ситуацию. Выбери подходящую форму.</p><div class=\"question\"><label>School starts at 8. I ___ leave home at 7:30.</label><select data-answer=\"have to\"><option value=\"\">Выбери ответ</option><option>have to</option><option>has to</option><option>don’t have to</option><option>doesn’t have to</option></select><span class=\"feedback\"></span></div><div class=\"question\"><label>It’s Sunday. We ___ go to school.</label><select data-answer=\"don’t have to\"><option value=\"\">Выбери ответ</option><option>have to</option><option>has to</option><option>don’t have to</option><option>doesn’t have to</option></select><span class=\"feedback\"></span></div><div class=\"question\"><label>Ella’s room is very messy. She ___ tidy it today.</label><select data-answer=\"has to\"><option value=\"\">Выбери ответ</option><option>have to</option><option>has to</option><option>don’t have to</option><option>doesn’t have to</option></select><span class=\"feedback\"></span></div><div class=\"question\"><label>Lunch is free at the camp. Jack ___ pay for it.</label><select data-answer=\"doesn’t have to\"><option value=\"\">Выбери ответ</option><option>have to</option><option>has to</option><option>don’t have to</option><option>doesn’t have to</option></select><span class=\"feedback\"></span></div><div class=\"question\"><label>The library rule says: “Be quiet.” You ___ be quiet here.</label><select data-answer=\"have to\"><option value=\"\">Выбери ответ</option><option>have to</option><option>has to</option><option>don’t have to</option><option>doesn’t have to</option></select><span class=\"feedback\"></span></div><div class=\"question\"><label>The project is optional. They ___ do it.</label><select data-answer=\"don’t have to\"><option value=\"\">Выбери ответ</option><option>have to</option><option>has to</option><option>don’t have to</option><option>doesn’t have to</option></select><span class=\"feedback\"></span></div><button class=\"check\" onclick=\"checkSlide()\">Проверить</button><p class=\"score\" aria-live=\"polite\"></p>"}, {"tag": "05 / PRACTICE", "title": "Собери правильную форму", "body": "<p>Обрати внимание на подлежащее и на вопросы.</p><div class=\"question\"><label>___ your brother have to help at home?</label><select data-answer=\"Does\"><option value=\"\">Выбери ответ</option><option>Do</option><option>Does</option><option>have to</option><option>has to</option><option>don’t</option><option>doesn’t</option></select><span class=\"feedback\"></span></div><div class=\"question\"><label>My sister ___ feed her cat every day.</label><select data-answer=\"has to\"><option value=\"\">Выбери ответ</option><option>Do</option><option>Does</option><option>have to</option><option>has to</option><option>don’t</option><option>doesn’t</option></select><span class=\"feedback\"></span></div><div class=\"question\"><label>___ you have to take a packed lunch?</label><select data-answer=\"Do\"><option value=\"\">Выбери ответ</option><option>Do</option><option>Does</option><option>have to</option><option>has to</option><option>don’t</option><option>doesn’t</option></select><span class=\"feedback\"></span></div><div class=\"question\"><label>He ___ have to get up early tomorrow. It’s a holiday.</label><select data-answer=\"doesn’t\"><option value=\"\">Выбери ответ</option><option>Do</option><option>Does</option><option>have to</option><option>has to</option><option>don’t</option><option>doesn’t</option></select><span class=\"feedback\"></span></div><div class=\"question\"><label>We ___ bring our own pencils. The teacher has no spare ones.</label><select data-answer=\"have to\"><option value=\"\">Выбери ответ</option><option>Do</option><option>Does</option><option>have to</option><option>has to</option><option>don’t</option><option>doesn’t</option></select><span class=\"feedback\"></span></div><div class=\"question\"><label>I ___ have to buy a ticket. Children enter for free.</label><select data-answer=\"don’t\"><option value=\"\">Выбери ответ</option><option>Do</option><option>Does</option><option>have to</option><option>has to</option><option>don’t</option><option>doesn’t</option></select><span class=\"feedback\"></span></div><button class=\"check\" onclick=\"checkSlide()\">Проверить</button><p class=\"score\" aria-live=\"polite\"></p>"}, {"tag": "06 / ПРАВИЛО", "title": "Future Simple: что будет?", "body": "<p>Используем <b>will</b>, чтобы сказать, что, по нашему мнению, произойдёт в будущем, пообещать что-то или решить что-то прямо сейчас.</p><div class=\"formula\">Кто? + will + глагол</div><div class=\"example\">I think our team will win.<small>Думаю, наша команда победит. — Предположение</small></div><div class=\"example\">I will help you. I promise!<small>Я помогу тебе. Обещаю! — Обещание</small></div><div class=\"example\">The phone is ringing. I’ll answer it!<small>Телефон звонит. Я отвечу! — Решение сейчас</small></div><p class=\"note\"><b>Will одинаковое для всех.</b> I’ll = I will; she’ll = she will.<br>She will play. Без -s и без to после will.</p>"}, {"tag": "07 / ПРАВИЛО", "title": "Won’t и вопросы с will", "body": "<div class=\"formula\">Кто? + won’t + глагол<br>Will + кто? + глагол?</div><div class=\"example\">I won’t tell anyone.<small>Я никому не расскажу. Won’t = will not.</small></div><div class=\"example\">Will people live on Mars?<small>Будут ли люди жить на Марсе?</small></div><div class=\"cards\"><div><b>Yes, they will.</b><p>Да.</p></div><div><b>No, they won’t.</b><p>Нет.</p></div></div><p class=\"note\">Слова-подсказки: <b>tomorrow</b> — завтра, <b>next week</b> — на следующей неделе, <b>in the future</b> — в будущем. Сами по себе они не всегда требуют will.</p>"}, {"tag": "08 / PRACTICE", "title": "Выбери правильный вариант", "body": "<p>После will и won’t глагол не меняется.</p><div class=\"question\"><label>I think Max ___ the game.</label><select data-answer=\"will win\"><option value=\"\">Выбери ответ</option><option>will win</option><option>will wins</option><option>won’t use</option><option>won’t to use</option><option>will open</option><option>Will you help</option><option>Do you will help</option><option>will be</option><option>will is</option><option>it won’t</option></select><span class=\"feedback\"></span></div><div class=\"question\"><label>I promise I ___ your tablet.</label><select data-answer=\"won’t use\"><option value=\"\">Выбери ответ</option><option>will win</option><option>will wins</option><option>won’t use</option><option>won’t to use</option><option>will open</option><option>Will you help</option><option>Do you will help</option><option>will be</option><option>will is</option><option>it won’t</option></select><span class=\"feedback\"></span></div><div class=\"question\"><label>The doorbell is ringing. I ___ the door!</label><select data-answer=\"will open\"><option value=\"\">Выбери ответ</option><option>will win</option><option>will wins</option><option>won’t use</option><option>won’t to use</option><option>will open</option><option>Will you help</option><option>Do you will help</option><option>will be</option><option>will is</option><option>it won’t</option></select><span class=\"feedback\"></span></div><div class=\"question\"><label>___ us with this bag, please?</label><select data-answer=\"Will you help\"><option value=\"\">Выбери ответ</option><option>will win</option><option>will wins</option><option>won’t use</option><option>won’t to use</option><option>will open</option><option>Will you help</option><option>Do you will help</option><option>will be</option><option>will is</option><option>it won’t</option></select><span class=\"feedback\"></span></div><div class=\"question\"><label>I think the film ___ great.</label><select data-answer=\"will be\"><option value=\"\">Выбери ответ</option><option>will win</option><option>will wins</option><option>won’t use</option><option>won’t to use</option><option>will open</option><option>Will you help</option><option>Do you will help</option><option>will be</option><option>will is</option><option>it won’t</option></select><span class=\"feedback\"></span></div><div class=\"question\"><label>Will it rain tomorrow? — No, ___.</label><select data-answer=\"it won’t\"><option value=\"\">Выбери ответ</option><option>will win</option><option>will wins</option><option>won’t use</option><option>won’t to use</option><option>will open</option><option>Will you help</option><option>Do you will help</option><option>will be</option><option>will is</option><option>it won’t</option></select><span class=\"feedback\"></span></div><button class=\"check\" onclick=\"checkSlide()\">Проверить</button><p class=\"score\" aria-live=\"polite\"></p>"}, {"tag": "09 / PRACTICE", "title": "Напиши сам", "body": "<p>Раскрой скобки. Используй <b>will / won’t</b> и глагол. Пиши полную форму или сокращение.</p><div class=\"question\"><label>I think robots ___ us at home. (help)</label><input data-answer=\"will help|'ll help\" placeholder=\"Впиши пропущенные слова\" autocomplete=\"off\"><span class=\"feedback\"></span></div><div class=\"question\"><label>I promise I ___ late again. (not be)</label><input data-answer=\"will not be|won’t be\" placeholder=\"Впиши пропущенные слова\" autocomplete=\"off\"><span class=\"feedback\"></span></div><div class=\"question\"><label>The bag is heavy. I ___ it for you! (carry)</label><input data-answer=\"will carry|'ll carry\" placeholder=\"Впиши пропущенные слова\" autocomplete=\"off\"><span class=\"feedback\"></span></div><div class=\"question\"><label>I think we ___ the match. (not lose)</label><input data-answer=\"will not lose|won’t lose\" placeholder=\"Впиши пропущенные слова\" autocomplete=\"off\"><span class=\"feedback\"></span></div><div class=\"question\"><label>___ famous one day? (she / be)</label><input data-answer=\"Will she be\" placeholder=\"Впиши пропущенные слова\" autocomplete=\"off\"><span class=\"feedback\"></span></div><div class=\"question\"><label>Will you call me? — Yes, ___. (I)</label><input data-answer=\"I will\" placeholder=\"Впиши пропущенные слова\" autocomplete=\"off\"><span class=\"feedback\"></span></div><button class=\"check\" onclick=\"checkSlide()\">Проверить</button><p class=\"score\" aria-live=\"polite\"></p>"}, {"tag": "10 / YOUR TURN", "title": "Твоя жизнь и твоё будущее", "body": "<p>Напиши <b>6 предложений</b>. Используй подсказки. Здесь нет единственного правильного ответа.</p><label class=\"writing\">Что тебе нужно делать дома? → I have to…<textarea placeholder=\"Твоё предложение…\"></textarea></label><label class=\"writing\">Что нужно делать твоему другу? → My friend has to…<textarea placeholder=\"Твоё предложение…\"></textarea></label><label class=\"writing\">Что тебе не обязательно делать в выходные? → I don’t have to…<textarea placeholder=\"Твоё предложение…\"></textarea></label><label class=\"writing\">Что другу не обязательно делать? → My friend doesn’t have to…<textarea placeholder=\"Твоё предложение…\"></textarea></label><label class=\"writing\">Твоё предположение о будущем → I think… will…<textarea placeholder=\"Твоё предложение…\"></textarea></label><label class=\"writing\">Твоё обещание → I promise I will / won’t…<textarea placeholder=\"Твоё предложение…\"></textarea></label>"}, {"tag": "FINISH", "title": "Готово!", "body": "<div class=\"hero\">YOU DID IT.</div><p>Проверь, что выполнил все упражнения. Скачай ответы и отправь файл учителю.</p><button class=\"check\" onclick=\"downloadAnswers()\">Скачать ответы</button><p class=\"note\">Ответы сохраняются в этом браузере автоматически, если он разрешает локальное сохранение. Можно вернуться к заданиям и исправить их.</p><div id=\"total\"></div>"}];let index=0;let saved={};try{saved=JSON.parse(localStorage.getItem('a2-have-will-v1')||'{}')}catch(e){}const main=document.querySelector('main');function render(){main.innerHTML='<div class="tag">'+slides[index].tag+'</div><h1>'+slides[index].title+'</h1>'+slides[index].body;main.querySelectorAll('input,select,textarea').forEach((el,i)=>{el.value=saved[index+'-'+i]||'';el.addEventListener('input',()=>{saved[index+'-'+i]=el.value;try{localStorage.setItem('a2-have-will-v1',JSON.stringify(saved))}catch(e){}})});document.querySelector('#page').textContent=(index+1)+' / '+slides.length;document.querySelector('#back').disabled=index===0;document.querySelector('#next').disabled=index===slides.length-1;document.querySelector('.bar div').style.width=((index+1)/slides.length*100)+'%';window.scrollTo(0,0)}function move(n){index=Math.max(0,Math.min(slides.length-1,index+n));render()}function norm(s){return s.toLowerCase().replace(/[’‘]/g,"'").replace(/[.!?]+$/,'').trim().replace(/\s+/g,' ')}function checkSlide(){let ok=0;const fields=main.querySelectorAll('[data-answer]');fields.forEach(el=>{const good=el.dataset.answer.split('|').some(a=>norm(a)===norm(el.value));ok+=good?1:0;el.classList.toggle('correct',good);el.classList.toggle('incorrect',!good);el.nextElementSibling.textContent=good?'✓ Верно':el.value?'Попробуй ещё раз. Загляни в правило.':'Сначала заполни ответ.'});main.querySelector('.score').textContent='Верно: '+ok+' из '+fields.length}function downloadAnswers(){let lines=['MY LIFE. MY FUTURE. — Ответы',''];slides.forEach((s,j)=>{let d=document.createElement('div');d.innerHTML=s.body;let fields=d.querySelectorAll('input,select,textarea');if(!fields.length)return;lines.push(s.title);fields.forEach((el,i)=>{let label=el.tagName==='TEXTAREA'?el.parentElement.firstChild.textContent:el.previousElementSibling.textContent;lines.push(label+' → '+(saved[j+'-'+i]||'[нет ответа]'))});lines.push('')});let blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/plain;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='My_homework_answers.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}document.querySelector('#back').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});render();</script></body></html>
